---
# Builds and runs GNOME Hearts (an unmaintained GTK2/libglade2/Python 2 app)
# on a modern Linux desktop, by compiling it from source inside an
# openSUSE Leap 15.4 distrobox container, whose repositories still ship
# gtk2-devel, libglade2-devel, libgnomeui-devel and python-devel (2.7) as
# ordinary, internally-consistent packages.
#
# Requires Docker and distrobox to already be installed (this playbook
# checks for them but does not install them, since how to do so varies
# by distribution).
#
# Usage:
#   ansible-playbook playbook.yml

- name: Build and run GNOME Hearts in an openSUSE Leap distrobox container
  hosts: localhost
  connection: local
  become: false

  vars:
    gnome_hearts_container: gnome-hearts
    gnome_hearts_image: registry.opensuse.org/opensuse/leap:15.4
    gnome_hearts_src: "{{ playbook_dir }}/../gnome-hearts-0.3.1"
    gnome_hearts_zypper_packages:
      - patterns-devel-base-devel_basis
      - autoconf
      - automake
      - libtool
      - intltool
      - pkg-config
      - gettext-tools
      - gtk2-devel
      - libglade2-devel
      - python-devel
      - libgnomeui-devel
      - rarian-scrollkeeper-compat

  environment:
    # distrobox defaults to podman; on systems where the user's supplementary
    # groups (e.g. vboxusers, for /dev/vboxusb) don't map into podman's
    # rootless user namespace, container start fails with a permission error.
    # Docker's root daemon doesn't have that problem, so we pin it here.
    DBX_CONTAINER_MANAGER: docker

  tasks:
    - name: Check whether Docker is installed
      ansible.builtin.command: docker --version
      register: gnome_hearts_docker_check
      failed_when: false
      changed_when: false

    - name: Fail with instructions if Docker is missing
      ansible.builtin.fail:
        msg: >-
          Docker was not found. Install it for your distribution (see
          https://docs.docker.com/engine/install/), make sure the docker
          service is running and your user is in the docker group, then
          re-run this playbook.
      when: gnome_hearts_docker_check.rc != 0

    - name: Check whether distrobox is installed
      ansible.builtin.command: distrobox version
      register: gnome_hearts_distrobox_check
      failed_when: false
      changed_when: false

    - name: Fail with instructions if distrobox is missing
      ansible.builtin.fail:
        msg: >-
          distrobox was not found. Install it for your distribution (see
          https://distrobox.it/#installation), then re-run this playbook.
      when: gnome_hearts_distrobox_check.rc != 0

    - name: Check whether the distrobox container already exists
      ansible.builtin.command: docker inspect {{ gnome_hearts_container }}
      register: gnome_hearts_container_check
      failed_when: false
      changed_when: false

    - name: Create the openSUSE Leap distrobox container
      ansible.builtin.command: >
        distrobox create -n {{ gnome_hearts_container }}
        -i {{ gnome_hearts_image }} -Y
      when: gnome_hearts_container_check.rc != 0

    - name: Initialize the container (first enter sets up sudo, user, etc.)
      ansible.builtin.command: distrobox enter -n {{ gnome_hearts_container }} -- true
      changed_when: false

    - name: Refresh zypper repository metadata
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        sudo zypper --non-interactive refresh
      changed_when: false

    - name: Install build dependencies inside the container
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        sudo zypper --non-interactive install -y {{ gnome_hearts_zypper_packages | join(' ') }}
      register: gnome_hearts_zypper_install
      changed_when: "'Nothing to do' not in gnome_hearts_zypper_install.stdout"

    - name: Configure the GNOME Hearts build
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        bash -c "cd {{ gnome_hearts_src }} && ./configure --prefix=/usr/local"
      args:
        creates: "{{ gnome_hearts_src }}/Makefile"

    - name: Build GNOME Hearts
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        bash -c "cd {{ gnome_hearts_src }} && make -j$(nproc)"
      args:
        creates: "{{ gnome_hearts_src }}/src/gnome-hearts"

    - name: Install GNOME Hearts inside the container
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        bash -c "cd {{ gnome_hearts_src }} && sudo make install && sudo ldconfig"
      changed_when: true

    - name: Export GNOME Hearts as a desktop application on the host
      ansible.builtin.command: >
        distrobox enter -n {{ gnome_hearts_container }} --
        distrobox-export --app gnome-hearts
      register: gnome_hearts_export
      changed_when: "'successfully exported' in gnome_hearts_export.stdout"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          GNOME Hearts is built and exported. Look for "Hearts (on
          gnome-hearts)" in your application launcher, or run:
          distrobox enter -n {{ gnome_hearts_container }} -- gnome-hearts
