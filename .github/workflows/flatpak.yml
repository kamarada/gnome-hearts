name: Flatpak

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  flatter:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/gnome:master
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNOME SDK
        run: flatpak install -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            packaging/flatpak/com.linuxkamarada.Hearts.json
          upload-pages-artifact: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
